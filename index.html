<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cine-Stream | Media Explorer</title>
  
  <!-- Inter & Plus Jakarta Sans typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* -------------------------------------------------------------
       DESIGN TOKENS & SYSTEM
       ------------------------------------------------------------- */
    :root {
      --bg-canvas: #090b10;
      --bg-surface: #11141c;
      --bg-surface-elevated: #181d27;
      --bg-surface-hover: #222936;
      --accent: #e50914;
      --accent-hover: #f40612;
      --accent-glow: rgba(229, 9, 20, 0.28);
      --accent-secondary: #38bdf8;
      --accent-secondary-glow: rgba(56, 189, 248, 0.25);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(229, 9, 20, 0.55);
      --star-gold: #fbbf24;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Reset & Base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-main);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      outline: none;
    }

    /* -------------------------------------------------------------
       NAVIGATION BAR
       ------------------------------------------------------------- */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(9, 11, 16, 0.88);
      border-bottom: 1px solid var(--border-subtle);
      transition: var(--transition);
    }

    .nav-container {
      max-width: 1360px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-primary);
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent) 0%, #b91c1c 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: var(--radius-full);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
      transition: var(--transition);
      border: 1px solid transparent;
    }

    .nav-btn:hover {
      color: var(--text-primary);
      background: var(--bg-surface-elevated);
    }

    .nav-btn.active {
      color: var(--text-primary);
      background: var(--bg-surface-elevated);
      border-color: var(--border-subtle);
    }

    .badge-count {
      background: var(--accent);
      color: #fff;
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: var(--radius-full);
      font-weight: 700;
    }

    .config-trigger-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: var(--radius-full);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      transition: var(--transition);
    }

    .config-trigger-btn:hover {
      border-color: var(--text-muted);
      color: var(--text-primary);
    }

    /* -------------------------------------------------------------
       HERO & SEARCH COMPONENT
       ------------------------------------------------------------- */
    .hero-section {
      position: relative;
      padding: 44px 24px 28px;
      max-width: 1360px;
      margin: 0 auto;
    }

    .hero-content {
      max-width: 760px;
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(229, 9, 20, 0.12);
      border: 1px solid rgba(229, 9, 20, 0.25);
      padding: 4px 12px;
      border-radius: var(--radius-full);
      margin-bottom: 14px;
    }

    .hero-title {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
    }

    .hero-title span {
      background: linear-gradient(135deg, #fff 40%, var(--text-secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      margin-bottom: 24px;
      max-width: 620px;
    }

    /* Search Bar with Debounce Indicator */
    .search-wrapper {
      position: relative;
      max-width: 680px;
      margin-bottom: 20px;
    }

    .search-input-box {
      width: 100%;
      height: 52px;
      padding: 0 48px 0 48px;
      background: var(--bg-surface);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      font-size: 0.95rem;
      color: var(--text-primary);
      font-family: inherit;
      outline: none;
      transition: var(--transition);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    .search-input-box:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-glow);
      background: var(--bg-surface-elevated);
    }

    .search-icon-left {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
    }

    .search-action-right {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .search-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    .clear-btn {
      color: var(--text-muted);
      padding: 4px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .clear-btn:hover {
      color: var(--text-primary);
      background: var(--bg-surface-hover);
    }

    /* -------------------------------------------------------------
       AI MOOD MATCHER SECTION
       ------------------------------------------------------------- */
    .ai-mood-card {
      background: linear-gradient(145deg, #131722 0%, #161a26 100%);
      border: 1px solid rgba(56, 189, 248, 0.15);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      margin-top: 16px;
      max-width: 680px;
      position: relative;
      overflow: hidden;
    }

    .ai-mood-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-secondary), transparent);
    }

    .ai-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .ai-card-title {
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #e0f2fe;
    }

    .ai-badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-secondary);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .ai-input-row {
      display: flex;
      gap: 10px;
    }

    .ai-input {
      flex: 1;
      height: 44px;
      padding: 0 16px;
      background: var(--bg-canvas);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      color: var(--text-primary);
      outline: none;
      transition: var(--transition);
      font-family: inherit;
    }

    .ai-input:focus {
      border-color: var(--accent-secondary);
      box-shadow: 0 0 0 3px var(--accent-secondary-glow);
    }

    .ai-submit-btn {
      height: 44px;
      padding: 0 18px;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
      white-space: nowrap;
    }

    .ai-submit-btn:hover:not(:disabled) {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }

    .ai-submit-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .ai-feedback {
      margin-top: 10px;
      font-size: 0.825rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ai-feedback.error {
      color: #f87171;
    }

    /* -------------------------------------------------------------
       MAIN CONTENT & MOVIE GRID
       ------------------------------------------------------------- */
    .main-content {
      max-width: 1360px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }

    .section-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .section-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 24px;
    }

    @media (max-width: 640px) {
      .movies-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 16px;
      }
    }

    /* Movie Card */
    .movie-card {
      background: var(--bg-surface);
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s ease, border-color 0.25s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .movie-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .poster-container {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      background: var(--bg-surface-elevated);
      overflow: hidden;
    }

    .poster-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .movie-card:hover .poster-img {
      transform: scale(1.03);
    }

    .poster-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      background: linear-gradient(145deg, #181d27 0%, #11141c 100%);
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .fav-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(9, 11, 16, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      transition: var(--transition);
      z-index: 2;
    }

    .fav-btn:hover {
      transform: scale(1.12);
      background: rgba(9, 11, 16, 0.95);
    }

    .fav-btn.is-favorite {
      color: var(--accent);
      background: rgba(229, 9, 20, 0.18);
      border-color: var(--accent);
    }

    .fav-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .movie-info {
      padding: 14px 14px 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .movie-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .movie-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .rating-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .rating-star {
      color: var(--star-gold);
    }

    /* Skeleton Placeholder */
    .skeleton-card {
      background: var(--bg-surface);
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
    }

    .skeleton-poster {
      width: 100%;
      aspect-ratio: 2 / 3;
      background: linear-gradient(90deg, #181d27 25%, #222936 50%, #181d27 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    .skeleton-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .skeleton-line {
      height: 14px;
      background: #1e2430;
      border-radius: 4px;
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    /* -------------------------------------------------------------
       INFINITE SCROLL SENTINEL & MESSAGES
       ------------------------------------------------------------- */
    .sentinel-section {
      padding: 40px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .loading-pulse {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .spinner-disc {
      width: 24px;
      height: 24px;
      border: 2.5px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .retry-button {
      padding: 8px 18px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      color: var(--text-primary);
      font-weight: 600;
      font-size: 0.85rem;
      transition: var(--transition);
    }

    .retry-button:hover {
      background: var(--bg-surface-hover);
      border-color: var(--text-muted);
    }

    .end-results-label {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* -------------------------------------------------------------
       EMPTY & ERROR STATES
       ------------------------------------------------------------- */
    .empty-state {
      text-align: center;
      padding: 64px 20px;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .empty-state-icon {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--bg-surface-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .empty-state-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .empty-state-desc {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* -------------------------------------------------------------
       MODAL: API CONFIGURATION
       ------------------------------------------------------------- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.2s ease-out;
    }

    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      max-width: 540px;
      width: 100%;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .modal-close-btn {
      color: var(--text-muted);
      padding: 6px;
      border-radius: var(--radius-sm);
      display: flex;
    }

    .modal-close-btn:hover {
      color: var(--text-primary);
      background: var(--bg-surface-elevated);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.825rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      background: var(--bg-canvas);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: var(--transition);
    }

    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .form-help {
      font-size: 0.775rem;
      color: var(--text-muted);
      margin-top: 5px;
      line-height: 1.4;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    .btn-secondary {
      padding: 9px 18px;
      border-radius: var(--radius-md);
      background: var(--bg-surface-elevated);
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.875rem;
      transition: var(--transition);
    }

    .btn-secondary:hover {
      background: var(--bg-surface-hover);
      color: var(--text-primary);
    }

    .btn-primary {
      padding: 9px 20px;
      border-radius: var(--radius-md);
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 0.875rem;
      transition: var(--transition);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>

  <!-- React 18 & ReactDOM via esm.sh CDN -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client"
      }
    }
  </script>

  <!-- Babel Standalone for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone@7.24.4/babel.min.js"></script>
</head>
<body>

  <div id="root">
    <div style="padding: 40px; text-align: center; color: #94a3b8; font-family: sans-serif;">
      Loading Cine-Stream application modules...
    </div>
  </div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef, useCallback, useMemo } from 'react';
    import ReactDOM from 'react-dom/client';

    /* =========================================================================
       1. CENTRALIZED API & GLOBAL CONFIGURATION
       =========================================================================
       Set your TMDB API v3 key below or dynamically configure it via the
       in-app Settings modal (stored strictly in localStorage).
       An active internet connection is mandatory to resolve external CDN
       scripts and fetch real TMDB media assets.
       ========================================================================= */
    const DEFAULT_CONFIG = {
      // TMDB v3 API Key (Paste your TMDB key here or configure inside UI)
      tmdbApiKey: '',
      tmdbBaseUrl: 'https://api.themoviedb.org/3',
      tmdbImageBaseUrl: 'https://image.tmdb.org/t/p/w500',
      
      // Optional AI Provider Configuration (Gemini or OpenAI format)
      // NOTE: In production environments, client-side secret keys must be
      // routed through a secure backend proxy to prevent credential exposure.
      aiApiKey: '',
      aiProvider: 'gemini', // 'gemini' | 'openai'
      aiModel: 'gemini-1.5-flash',
      geminiEndpoint: 'https://generativelanguage.googleapis.com/v1beta/models'
    };

    const STORAGE_KEYS = {
      FAVORITES: 'cine_stream_favs_v1',
      CONFIG: 'cine_stream_cfg_v1'
    };

    /* Safe LocalStorage Helper with fallback */
    function loadSavedConfig() {
      try {
        const stored = localStorage.getItem(STORAGE_KEYS.CONFIG);
        if (stored) {
          const parsed = JSON.parse(stored);
          return { ...DEFAULT_CONFIG, ...parsed };
        }
      } catch (e) {
        console.warn('[Cine-Stream] Failed to read settings from storage', e);
      }
      return DEFAULT_CONFIG;
    }

    function saveConfigToStorage(cfg) {
      try {
        localStorage.setItem(STORAGE_KEYS.CONFIG, JSON.stringify(cfg));
      } catch (e) {
        console.error('[Cine-Stream] Failed to store configuration', e);
      }
    }

    function loadSavedFavorites() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.FAVORITES);
        if (raw) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr)) return arr;
        }
      } catch (e) {
        console.warn('[Cine-Stream] Failed to restore favorites', e);
      }
      return [];
    }

    function saveFavoritesToStorage(favs) {
      try {
        localStorage.setItem(STORAGE_KEYS.FAVORITES, JSON.stringify(favs));
      } catch (e) {

    /* =========================================================================
       4. AI MOOD MATCHER COMPONENT
       ========================================================================= */
    function AiMoodMatcher({ config, onSelectMovieTitle }) {
      const [prompt, setPrompt] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [feedback, setFeedback] = useState(null);

      const handleMoodSubmit = async (e) => {
        e.preventDefault();
        const trimmed = prompt.trim();
        if (!trimmed) {
          setFeedback({ type: 'error', text: 'Please enter a mood or cinema vibe description.' });
          return;
        }

        if (!config.aiApiKey) {
          setFeedback({
            type: 'error',
            text: 'AI API Key is not configured. Click "Settings" in the navigation bar to add a free Gemini API key.'
          });
          return;
        }

        setIsLoading(true);
        setFeedback(null);

        const systemInstruction = `You are a film curator. The user describes their emotional state, mood, or desired vibe. Recommend EXACTLY ONE specific movie title that fits best. Return ONLY the movie title as plain text. Do not include quotes, markdown, bullet points, years, or commentary.`;

        try {
          let movieTitle = '';

          if (config.aiProvider === 'gemini') {
            const url = `${config.geminiEndpoint}/${config.aiModel}:generateContent?key=${encodeURIComponent(config.aiApiKey)}`;
            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{
                  parts: [
                    { text: systemInstruction },
                    { text: `User mood: "${trimmed}"` }
                  ]
                }]
              })
            });

            if (!response.ok) {
              const errData = await response.json().catch(() => ({}));
              throw new Error(errData.error?.message || `AI service responded with HTTP status ${response.status}`);
            }

            const data = await response.json();
            movieTitle = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
          } else {
            // OpenAI compatible standard
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${config.aiApiKey}`
              },
              body: JSON.stringify({
                model: 'gpt-3.5-turbo',
                messages: [
                  { role: 'system', content: systemInstruction },
                  { role: 'user', content: trimmed }
                ],
                temperature: 0.7,
                max_tokens: 20
              })
            });

            if (!response.ok) {
              throw new Error(`OpenAI responded with status ${response.status}`);
            }

            const data = await response.json();
            movieTitle = data?.choices?.[0]?.message?.content || '';
          }

          // Clean title: remove wrapping quotes or punctuation
          const cleanedTitle = movieTitle.replace(/["'«»]/g, '').trim();

          if (!cleanedTitle) {
            throw new Error('AI was unable to formulate a movie recommendation for this prompt.');
          }

          setFeedback({ type: 'success', text: `AI matched your mood with: "${cleanedTitle}". Fetching title...` });
          onSelectMovieTitle(cleanedTitle);
        } catch (err) {
          console.error('[AI Mood Matcher]', err);
          setFeedback({ type: 'error', text: err.message || 'Failed to generate recommendation. Check your key and connectivity.' });
        } finally {
          setIsLoading(false);
        }
      };

      return (
        <section className="ai-mood-card" aria-label="AI Mood Matcher">
          <div className="ai-card-header">
            <h2 className="ai-card-title">
              <SparklesIcon />
              Find a Movie for Your Mood
            </h2>
            <span className="ai-badge">AI Assistant</span>
          </div>

          <form onSubmit={handleMoodSubmit} className="ai-input-row">
            <input
              type="text"
              className="ai-input"
              value={prompt}
              onChange={(e) => setPrompt(e.target.value)}
              placeholder="e.g., Feeling nostalgic for 90s sci-fi, or rainy Sunday thriller..."
              aria-label="Describe your movie mood"
              disabled={isLoading}
            />
            <button
              type="submit"
              className="ai-submit-btn"
              disabled={isLoading || !prompt.trim()}
            >
              {isLoading ? (
                <>
                  <span className="spinner-disc" style={{ width: '16px', height: '16px' }}></span>
                  Curating...
                </>
              ) : (
                'Curate'
              )}
            </button>
          </form>

          {feedback && (
            <div className={`ai-feedback ${feedback.type === 'error' ? 'error' : ''}`}>
              <span>{feedback.text}</span>
            </div>
          )}
        </section>
      );
    }

    /* =========================================================================
       6. MAIN SPA APPLICATION CONTAINER
       ========================================================================= */
    function CineStreamApp() {
      // Configuration & modal state
      const [config, setConfig] = useState(loadSavedConfig);
      const [isConfigOpen, setIsConfigOpen] = useState(false);

      // Route state: Supports clean "/favorites" with Hash "#/favorites" fallback
      const [currentRoute, setCurrentRoute] = useState(() => {
        const path = window.location.pathname;
        const hash = window.location.hash;
        if (path === '/favorites' || hash === '#/favorites') return '/favorites';
        return '/';
      });

      // Favorites stored in localStorage
      const [favorites, setFavorites] = useState(loadSavedFavorites);

      // Media query & pagination state
      const [searchQuery, setSearchQuery] = useState('');
      const [debouncedQuery, setDebouncedQuery] = useState('');
      const [isDebouncing, setIsDebouncing] = useState(false);

      const [movies, setMovies] = useState([]);
      const [page, setPage] = useState(1);
      const [totalPages, setTotalPages] = useState(1);
      const [isLoading, setIsLoading] = useState(false);
      const [isAppending, setIsAppending] = useState(false);
      const [fetchError, setFetchError] = useState(null);

      // References for Infinite Scrolling & Network Request Aborts
      const sentinelRef = useRef(null);
      const abortControllerRef = useRef(null);
      const debounceTimerRef = useRef(null);

      /* -------------------------------------------------------------
         ROUTING & BROWSER HISTORY INTEGRATION
         ------------------------------------------------------------- */
      const navigateTo = useCallback((route) => {
        if (route === currentRoute) return;
        
        // Push state using both clean path and hash fallback for static hosts
        try {
          if (route === '/favorites') {
            window.history.pushState({ route }, '', '#/favorites');
          } else {
            window.history.pushState({ route }, '', window.location.pathname.replace(/\/favorites$/, '') || '/');
          }
        } catch (e) {
          window.location.hash = route === '/favorites' ? '#/favorites' : '#/';
        }
        setCurrentRoute(route);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, [currentRoute]);

      useEffect(() => {
        const handlePopState = (event) => {
          const path = window.location.pathname;
          const hash = window.location.hash;
          if (path === '/favorites' || hash === '#/favorites') {
            setCurrentRoute('/favorites');
          } else {
            setCurrentRoute('/');
          }
        };

        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, []);

      /* -------------------------------------------------------------
         FAVORITES MANAGEMENT
         ------------------------------------------------------------- */
      const handleToggleFavorite = useCallback((movie) => {
        setFavorites((prev) => {
          const exists = prev.some((item) => item.id === movie.id);
          let updated;
          if (exists) {
            updated = prev.filter((item) => item.id !== movie.id);
          } else {
            // Store only minimal normalized fields needed for UI
            const sanitizedMovie = {
              id: movie.id,
              title: movie.title || 'Untitled',
              poster_path: movie.poster_path || null,
              release_date: movie.release_date || '',
              vote_average: typeof movie.vote_average === 'number' ? movie.vote_average : 0
            };
            updated = [sanitizedMovie, ...prev];
          }
          saveFavoritesToStorage(updated);
          return updated;
        });
      }, []);

      const favoriteIdsSet = useMemo(() => {
        return new Set(favorites.map((m) => m.id));
      }, [favorites]);

      /* -------------------------------------------------------------
         500ms DEBOUNCED SEARCH UTILITY
         ------------------------------------------------------------- */
      const handleSearchInputChange = (e) => {
        const val = e.target.value;
        setSearchQuery(val);
        setIsDebouncing(true);

        if (debounceTimerRef.current) {
          clearTimeout(debounceTimerRef.current);
        }

        debounceTimerRef.current = setTimeout(() => {
          setDebouncedQuery(val.trim());
          setIsDebouncing(false);
        }, 500);
      };

      const handleClearSearch = () => {
        if (debounceTimerRef.current) clearTimeout(debounceTimerRef.current);
        setSearchQuery('');
        setDebouncedQuery('');
        setIsDebouncing(false);
      };

      /* -------------------------------------------------------------
         TMDB MOVIE FETCH LOGIC
         ------------------------------------------------------------- */
      const fetchMovies = useCallback(async (targetPage, activeQuery, isNewSearch = false) => {
        if (!config.tmdbApiKey) {
          setFetchError('TMDB API Key missing. Please open Settings to configure your key.');
          setIsLoading(false);
          setIsAppending(false);
          return;
        }

        // Cancel pending requests to guarantee the latest query wins
        if (abortControllerRef.current) {
          abortControllerRef.current.abort();
        }
        const controller = new AbortController();
        abortControllerRef.current = controller;

        if (targetPage === 1) {
          setIsLoading(true);
        } else {
          setIsAppending(true);
        }
        setFetchError(null);

        try {
          const endpoint = activeQuery
            ? `${config.tmdbBaseUrl}/search/movie?api_key=${encodeURIComponent(config.tmdbApiKey)}&query=${encodeURIComponent(activeQuery)}&page=${targetPage}&include_adult=false`
            : `${config.tmdbBaseUrl}/movie/popular?api_key=${encodeURIComponent(config.tmdbApiKey)}&page=${targetPage}`;

          const res = await fetch(endpoint, { signal: controller.signal });

          if (!res.ok) {
            if (res.status === 401) {
              throw new Error('Invalid TMDB API key. Verify your key in settings.');
            }
            if (res.status === 429) {
              throw new Error('TMDB rate limit reached. Please wait a moment before retrying.');
            }
            throw new Error(`TMDB responded with HTTP ${res.status}`);
          }

          const data = await res.json();
          const incomingResults = Array.isArray(data.results) ? data.results : [];

          setTotalPages(data.total_pages || 1);
          setPage(targetPage);

          setMovies((prev) => {
            if (isNewSearch || targetPage === 1) {
              return incomingResults;
            }
            // De-duplicate movie cards by stable ID when appending pages
            const existingIds = new Set(prev.map((m) => m.id));
            const filteredNew = incomingResults.filter((m) => !existingIds.has(m.id));
            return [...prev, ...filteredNew];
          });
        } catch (err) {
          if (err.name === 'AbortError') {
            // Handled intentionally: newer search or navigation took precedence
            return;
          }
          console.error('[Cine-Stream Fetch Error]', err);
          setFetchError(err.message || 'Network connection failed. Please check your connection.');
        } finally {
          setIsLoading(false);
          setIsAppending(false);
        }
      }, [config.tmdbApiKey, config.tmdbBaseUrl]);

      // Trigger fetch when debounced query updates or active route returns to home
      useEffect(() => {
        if (currentRoute !== '/') return;
        setPage(1);
        fetchMovies(1, debouncedQuery, true);

        return () => {
          if (abortControllerRef.current) abortControllerRef.current.abort();
        };
      }, [debouncedQuery, currentRoute, fetchMovies]);

      /* -------------------------------------------------------------
         INFINITE SCROLL VIA INTERSECTION OBSERVER
         ------------------------------------------------------------- */
      useEffect(() => {
        if (currentRoute !== '/') return;
        const target = sentinelRef.current;
        if (!target) return;

        const observer = new IntersectionObserver(
          (entries) => {
            const first = entries[0];
            if (first.isIntersecting && !isLoading && !isAppending && page < totalPages && !fetchError) {
              fetchMovies(page + 1, debouncedQuery, false);
            }
          },
          { rootMargin: '300px' }
        );

        observer.observe(target);
        return () => observer.disconnect();
      }, [currentRoute, isLoading, isAppending, page, totalPages, debouncedQuery, fetchError, fetchMovies]);

      return (
        <div className="cine-stream-app">
          {/* Header Navigation */}
          <nav className="navbar">
            <div className="nav-container">
              <a
                href="#/"
                className="brand-logo"
                onClick={(e) => { e.preventDefault(); navigateTo('/'); }}
                aria-label="Cine-Stream Home"
              >
                <div className="brand-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="#ffffff">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                  </svg>
                </div>
                <span>Cine-Stream</span>
              </a>

              <div className="nav-links">
                <button
                  type="button"
                  className={`nav-btn ${currentRoute === '/' ? 'active' : ''}`}
                  onClick={() => navigateTo('/')}
                  aria-current={currentRoute === '/' ? 'page' : undefined}
                >
                  Discover
                </button>
                <button
                  type="button"
                  className={`nav-btn ${currentRoute === '/favorites' ? 'active' : ''}`}
                  onClick={() => navigateTo('/favorites')}
                  aria-current={currentRoute === '/favorites' ? 'page' : undefined}
                >
                  Favorites
                  {favorites.length > 0 && <span className="badge-count">{favorites.length}</span>}
                </button>
                <button
                  type="button"
                  className="config-trigger-btn"
                  onClick={() => setIsConfigOpen(true)}
                  aria-label="API settings"
                >
                  <SettingsIcon />
                  <span>Settings</span>
                </button>
              </div>
            </div>
          </nav>

          {/* Active Route Rendering */}
          {currentRoute === '/' ? (
            <>
              {/* Hero Banner, Search & AI Mood Matcher */}
              <section className="hero-section">
                <div className="hero-content">
                  <div className="hero-tag">SaaS Movie Discovery</div>
                  <h1 className="hero-title">
                    <span>Unlimited cinema.</span><br />
                    Tailored for your mood.
                  </h1>
                  <p className="hero-subtitle">
                    Explore high-rated movies, search real-time global databases, and let artificial intelligence match your emotional state to unforgettable cinema.
                  </p>

                  {/* Search Bar with Debounce indicator */}
                  <div className="search-wrapper">
                    <div className="search-icon-left">
                      <SearchIcon />
                    </div>
                    <input
                      type="text"
                      className="search-input-box"
                      value={searchQuery}
                      onChange={handleSearchInputChange}
                      placeholder="Search films by title, franchise, or keywords..."
                      aria-label="Search movies"
                    />
                    <div className="search-action-right">
                      {isDebouncing && <div className="search-spinner" title="Debouncing keystrokes..."></div>}
                      {searchQuery && (
                        <button
                          type="button"
                          className="clear-btn"
                          onClick={handleClearSearch}
                          aria-label="Clear search query"
                        >
                          <CloseIcon />
                        </button>
                      )}
                    </div>
                  </div>

                  {/* AI Mood Matcher Assistant */}
                  <AiMoodMatcher
                    config={config}
                    onSelectMovieTitle={(recommendedTitle) => {
                      setSearchQuery(recommendedTitle);
                      setDebouncedQuery(recommendedTitle);
                    }}
                  />
                </div>
              </section>

              {/* Main Discover Grid */}
              <main className="main-content">
                <div className="section-header">
                  <h2 className="section-title">
                    {debouncedQuery ? `Results for "${debouncedQuery}"` : 'Popular Movies'}
                  </h2>
                  <span className="section-meta">
                    {debouncedQuery && movies.length > 0 && `Page ${page} of ${totalPages}`}
                  </span>
                </div>

                {/* API Missing Warning */}
                {!config.tmdbApiKey && (
                  <div className="empty-state">
                    <div className="empty-state-icon">
                      <SettingsIcon />
                    </div>
                    <h3 className="empty-state-title">TMDB API Key Required</h3>
                    <p className="empty-state-desc">
                      To begin discovering and streaming movie metadata, configure your free TMDB v3 API Key in the application settings.
                    </p>
                    <button
                      type="button"
                      className="btn-primary"
                      style={{ marginTop: '14px' }}
                      onClick={() => setIsConfigOpen(true)}
                    >
                      Configure API Key
                    </button>
                  </div>
                )}

                {/* Network or Key Error */}
                {fetchError && config.tmdbApiKey && (
                  <div className="empty-state">
                    <div className="empty-state-icon" style={{ color: 'var(--accent)' }}>
                      <CloseIcon />
                    </div>
                    <h3 className="empty-state-title">Unable to Load Media</h3>
                    <p className="empty-state-desc">{fetchError}</p>
                    <button
                      type="button"
                      className="retry-button"
                      style={{ marginTop: '12px' }}
                      onClick={() => fetchMovies(page, debouncedQuery, page === 1)}
                    >
                      Retry Connection
                    </button>
                  </div>
                )}

                {/* Initial Loading Skeleton */}
                {isLoading && (
                  <div className="movies-grid" aria-busy="true">
                    {Array.from({ length: 10 }).map((_, i) => (
                      <MovieCardSkeleton key={`skeleton-${i}`} />
                    ))}
                  </div>
                )}

                {/* Empty Search Results State */}
                {!isLoading && !fetchError && config.tmdbApiKey && movies.length === 0 && (
                  <div className="empty-state">
                    <div className="empty-state-icon">
                      <SearchIcon />
                    </div>
                    <h3 className="empty-state-title">No Movies Found</h3>
                    <p className="empty-state-desc">
                      We couldn't find any titles matching "{debouncedQuery}". Try refining your search query or reset back to popular movies.
                    </p>
                    <button
                      type="button"
                      className="retry-button"
                      style={{ marginTop: '12px' }}
                      onClick={handleClearSearch}
                    >
                      Reset to Popular
                    </button>
                  </div>
                )}

                {/* Movie Grid */}
                {!isLoading && movies.length > 0 && (
                  <div className="movies-grid">
                    {movies.map((movie) => (
                      <MovieCard
                        key={movie.id}
                        movie={movie}
                        isFavorite={favoriteIdsSet.has(movie.id)}
                        onToggleFavorite={handleToggleFavorite}
                        imageBaseUrl={config.tmdbImageBaseUrl}
                      />
                    ))}
                  </div>
                )}

                {/* Infinite Scroll Sentinel & Append Status */}
                {config.tmdbApiKey && movies.length > 0 && (
                  <div ref={sentinelRef} className="sentinel-section">
                    {isAppending && (
                      <div className="loading-pulse">
                        <span className="spinner-disc"></span>
                        <span>Loading additional movies...</span>
                      </div>
                    )}
                    {!isAppending && page >= totalPages && (
                      <span className="end-results-label">You have reached the end of the collection.</span>
                    )}
                  </div>
                )}
              </main>
            </>
          ) : (
            /* Dedicated Favorites Route View */
            <main className="main-content" style={{ paddingTop: '32px' }}>
              <div className="section-header">
                <div>
                  <h1 className="section-title">Saved Favorites</h1>
                  <p className="section-meta">Movies stored persistently in your local device workspace.</p>
                </div>
                <button
                  type="button"
                  className="retry-button"
                  onClick={() => navigateTo('/')}
                >
                  Back to Discover
                </button>
              </div>

              {favorites.length === 0 ? (
                <div className="empty-state">
                  <div className="empty-state-icon">
                    <HeartIcon filled={false} />
                  </div>
                  <h2 className="empty-state-title">Your Watchlist is Empty</h2>
                  <p className="empty-state-desc">
                    You haven't saved any movies to your favorites list yet. Click the heart icon on any movie card to store it here.
                  </p>
                  <button
                    type="button"
                    className="btn-primary"
                    style={{ marginTop: '14px' }}
                    onClick={() => navigateTo('/')}
                  >
                    Explore Movies
                  </button>
                </div>
              ) : (
                <div className="movies-grid">
                  {favorites.map((movie) => (
                    <MovieCard
                      key={movie.id}
                      movie={movie}
                      isFavorite={true}
                      onToggleFavorite={handleToggleFavorite}
                      imageBaseUrl={config.tmdbImageBaseUrl}
                    />
                  ))}
                </div>
              )}
            </main>
          )}

          {/* Configuration Settings Modal */}
          <ConfigModal
            config={config}
            isOpen={isConfigOpen}
            onClose={() => setIsConfigOpen(false)}
            onSave={(newCfg) => {
              setConfig(newCfg);
              saveConfigToStorage(newCfg);
            }}
          />
        </div>
      );
    }

    // Mount Application
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<CineStreamApp />);
  </script>
</body>
</html>
